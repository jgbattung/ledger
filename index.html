    <!--
      viewport-fit=cover is load-bearing, not cosmetic: without it
      env(safe-area-inset-*) resolves to 0 on device, and the bottom bar, the
      FAB's clearance and the sheet's bottom padding all silently lose their
      allowance for the Android gesture bar. Enforced by src/design-tokens.test.ts.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
